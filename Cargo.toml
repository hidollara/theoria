[package]
name = "theoria"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/theoria-canvas",
    "crates/theoria-renderer",
    "crates/theoria-webgpu",
    "crates/theoria-vulkan",
    "crates/theoria-color",
    "crates/theoria-component",
    "crates/theoria-event",
    "crates/theoria-reactive",
]
resolver = "3"

[features]
default = ["vulkan", "webgpu"]
vulkan = ["dep:theoria-vulkan"]
webgpu = ["dep:theoria-webgpu"]

[dependencies]
theoria-renderer = { path = "crates/theoria-renderer", features = ["tessellation"] }
flate2 = "1.1.2"
harfrust = "0.13.2"
icu_locale_core = "2.3.0"
icu_properties = { version = "2.3.0", features = ["unicode_bidi"] }
icu_segmenter = { version = "2.3.0", features = ["unstable"] }
png = "0.18.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
skrifa = "0.46.2"
theoria-canvas = { path = "crates/theoria-canvas" }
theoria-component = { path = "crates/theoria-component" }
theoria-color = { path = "crates/theoria-color" }
theoria-event = { path = "crates/theoria-event" }
theoria-reactive = { path = "crates/theoria-reactive" }
theoria-vulkan = { path = "crates/theoria-vulkan", features = ["win32"], optional = true }
unicode-bidi = { version = "0.3.18", default-features = false }
theoria-webgpu = { path = "crates/theoria-webgpu", optional = true }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
font-test-data = "0.8.0"

[[example]]
name = "animation"
required-features = ["vulkan"]

[[example]]
name = "canvas"
required-features = ["vulkan"]

[[example]]
name = "message_aquarium"
required-features = ["vulkan"]

[[example]]
name = "multi_window"
required-features = ["vulkan"]

[[example]]
name = "star_button"
required-features = ["vulkan"]

[[example]]
name = "text_layout"
required-features = ["vulkan"]
