[package]
name = "theoria"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/theoria-geometry",
    "crates/theoria-canvas",
    "crates/theoria-text",
    "crates/theoria-runtime",
    "crates/theoria-windows",
    "crates/theoria-interaction",
    "crates/theoria-renderer",
    "crates/theoria-webgpu",
    "crates/theoria-vulkan",
    "crates/theoria-color",
    "crates/theoria-component",
    "crates/theoria-event",
    "crates/theoria-reactive",
]
resolver = "3"

[features]
default = ["vulkan", "webgpu"]
vulkan = ["dep:theoria-vulkan", "theoria-windows/vulkan"]
webgpu = ["dep:theoria-webgpu"]

[dependencies]
theoria-renderer = { path = "crates/theoria-renderer" }
png = "0.18.0"
theoria-canvas = { path = "crates/theoria-canvas" }
theoria-geometry = { path = "crates/theoria-geometry" }
theoria-component = { path = "crates/theoria-component" }
theoria-color = { path = "crates/theoria-color" }
theoria-event = { path = "crates/theoria-event" }
theoria-interaction = { path = "crates/theoria-interaction" }
theoria-reactive = { path = "crates/theoria-reactive" }
theoria-runtime = { path = "crates/theoria-runtime" }
theoria-text = { path = "crates/theoria-text" }
theoria-vulkan = { path = "crates/theoria-vulkan", optional = true }
theoria-webgpu = { path = "crates/theoria-webgpu", optional = true }

[target.'cfg(windows)'.dependencies]
theoria-windows = { path = "crates/theoria-windows" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "animation"
required-features = ["vulkan"]

[[example]]
name = "canvas"
required-features = ["vulkan"]

[[example]]
name = "message_aquarium"
required-features = ["vulkan"]

[[example]]
name = "multi_window"
required-features = ["vulkan"]

[[example]]
name = "star_button"
required-features = ["vulkan"]

[[example]]
name = "text_layout"
required-features = ["vulkan"]
