[package]
name = "theoria"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "0.38.0"
lyon_tessellation = "1.0.20"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in", "spv-out"] }
