[package]
name = "organon-proc-macro"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
proc-macro = true

[dependencies]
organon-compiler = { path = "../organon-compiler" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
theoria-canvas = { path = "../theoria-canvas" }
theoria-text = { path = "../theoria-text" }
theoria-reactive = { path = "../theoria-reactive" }
theoria-component = { path = "../theoria-component" }
