[package]
name = "theoria-windows"
version = "0.1.0"
edition = "2024"

[features]
default = []
vulkan = ["dep:theoria-vulkan", "dep:theoria-reactive"]

[target.'cfg(windows)'.dependencies]
theoria-canvas = { path = "../theoria-canvas" }
theoria-component = { path = "../theoria-component" }
theoria-event = { path = "../theoria-event" }
theoria-reactive = { path = "../theoria-reactive", optional = true }
theoria-runtime = { path = "../theoria-runtime" }
theoria-vulkan = { path = "../theoria-vulkan", features = ["win32"], optional = true }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }
